=====================================================================
 MATH TEST BUILDER – versionshistorik och filöversikt
=====================================================================
 En enda HTML-fil. Körs i Chrome eller Edge utan installation.
 Gränssnittet är på engelska, utskriften har svenska etiketter.
 All data ligger i webbläsarens localStorage:
   mtb4_pool (frågor), mtb5_cfg (provet som redigeras och vald klass), mtb5_tests (sparade prov),
   mtb5_classes (klasser med elever och tilldelade prov, inklusive seeds), mtb4_log (utskriftslogg).
   (mtb4_stu, mtb4_tests och mtb4_classes från 4.x används inte längre men raderas inte.)

 5.48  2026-10-24
      Utskrift utan dialog. Appen skickar redan varje elev som ett eget utskriftsjobb (printSet), så skrivarens häftning kan sättas per elev. Det som tog tid var utskriftsdialogen för varje elev. En webbsida kan inte styra häftning eller andra skrivaralternativ, men webbläsaren kan skriva ut direkt till standardskrivaren med dess standardinställningar om den startas med --kiosk-printing. Till det följer två startfiler med (Windows .bat och Mac .command), som startar Chrome eller Edge på det sättet. Stäng alla webbläsarfönster först, annars ignoreras flaggan. Häftning ställs in en gång som standard i skrivarens inställningar (Windows: Skrivaregenskaper, Utskriftsinställningar, Efterbehandling).
      - printReady(): före varje jobb väntar appen nu på att bilder och typsnitt är inlästa och att sidan ritats, och väntetiden efter jobbet är 0,8 s i stället för 0,5 s. Utan dialog skrivs sidan ut direkt, och då kunde en bild eller figur annars saknas.

 5.46  2026-10-24

 5.45  2026-10-24

      - Position: left, center, right eller manual. Reglaget (0 till 100 % av den lediga bredden) och talfältet visas bara när manual är valt. Med radbrytning flyter bilden åt det håll som har mest plats. En centrerad bild kan inte ha text vid sidan och står därför ensam på sina rader. Position visas inte för in line with the text.
      - Anchor: vilken rad bilden hör till. Top of the question, Before row N (raderna i problemtexten visas med sin text), Before part a), b) … i en delad fråga eller End of the question. Bilden läggs in i textflödet vid raden, så radbrytningen börjar där. Radnumren gäller den första formuleringen i listan.

 5.43  2026-10-24
      Cirklar, cirkelbågar och skärningspunkter i figurer. Tre nya poster under Contents: circle, arc och intersection.
      - Circle: mittpunkt (en punkt) och radie som antingen ett uttryck (en längd) eller att cirkeln går genom en annan punkt. Färg, stil och etikett med valfri vinkel runt cirkeln. Med olika skala på axlarna ritas cirkeln som en ellips, eftersom den är rund i koordinaterna.
      - Arc: samma mittpunkt och radie, med början och slut antingen som två vinklar i grader (uttryck, moturs) eller som två punkter, och en kryssruta för medurs. Etiketten placeras vid bågens mitt.
      - Intersection: en ny namngiven punkt där två objekt (funktion, linje, sträcka, stråle, cirkel eller båge) skär varandra. Finns flera skärningar väljer numret vilken: 1 är den längst till vänster (minst x), 2 nästa. Punkten kan användas av linjer, cirklar och vinklar som vilken punkt som helst. Definiera skärningspunkter efter de objekt de använder.
      - Skärningar räknas på det som ritas (efter inte skalenligt-förskjutningen), så punkten ligger alltid på objekten. Funktioner provas i 500 steg med teckenbyte och halvering, så en tangering (funktionen rör bara vid linjen) hittas inte. Sträckor, strålar och bågar ger bara de skärningar som ligger på dem.
      - Scale to fit räknar nu med cirklar och bågar (som hela cirklar). Inte skalenligt ändrar även radien (upp till 6 %) och bågens vinklar (upp till ca 5 grader).
      - Tekniskt: geo() i figRender ger objektets form i koordinater, och isects() räknar skärningarna (ll, lc, c2, fx). Objekt som refereras av en skärningspunkt får ett id (nid) när de skapas eller när figuren öppnas i editorn.

      Fler exkluderingsblock och varningar i editorn.
      - Nya block: divisible by ▢ but not by ▢, within ▢ of ▢ (avstånd och tal, så att a och b inte blir nästan lika), ends in the same digit as ▢, has digit sum ▢, a perfect cube, a palindrome (like 121). Block med två rutor har fälten a och b. De äldre blocken är oförändrade.

 5.38  2026-10-24
      Dubblettskydd och exkluderingar för slumptal.
      1. Dubblettskydd (inst med fingeravtryck). Får en elev samma fråga flera gånger på provet och en av versionerna blir identisk med en tidigare (samma formulering och samma värden) dras en ny version ur samma slumpgenerator, upp till 40 gånger. Första försöket är oförändrat, så en uppgift som inte var en dubblett får exakt samma tal som förut. Det är helt deterministiskt. Orsaken till dubbletterna var inte seeden (varje uppgift har redan en egen hash av seed och nyckel) utan små talområden, där två dragningar ibland råkar bli lika. Att lägga till primtal till seeden hade inte hjälpt. Har en fråga färre möjliga versioner än antalet kopior kan en dubblett fortfarande uppstå.
      2. Exkluderingar. Slumptalsblocken Random number, Random set och Random decimal får en rad "exclude" med rutor och knappen "+ add exclusion" (v.ex = lista med {c:nod}). Raden och exkluderingsblocken i paletten visas bara när kryssrutan "Exclusions for random numbers" är på (finns raden redan på ett block visas den alltid). Dra ett exkluderingsblock eller ett talblock till en ruta. Ett talblock betyder just det talet. Blocken: divisible by, has a common factor with, contains the digit, a prime number, a perfect square, an even number, an odd number, a whole number (decimaler), ends in 0 (decimalen försvinner, t.ex. 3,200).
      - Koden: exFilter() filtrerar kandidaterna i runS innan talet dras. Block utan exkluderingar slumpar som förut. Blir ingenting kvar försöker inst om (400 gånger) och frågan visar sedan ?.
      - Tekniskt: XT/XL/XTS (blocktyper), exPred, exBar (raden i rb), exPal (paletten), addex/delex (knapparna). Exkluderingsblock kan bara släppas i en exkluderingsruta.

 5.31  2026-10-20
      Biggest, smallest och filter visar värdet i samma form som det skrevs in.
      - Förut returnerades det uträknade värdet, så ett inmatat uttryck som π + 1 eller 2·π·a visades som decimaltalet 4,142 i stället för som π + 1. Nu får värdet med sig hur det skrevs in (rd: en funktion som ritar ursprungsblocket med rn) och visas så vid direkt visning, även när det ligger i en variabel eller en lista. Parenteser sätts efter sammanhanget: 2 · biggest(π + 1, 3) visas som 2 · (π + 1).

// Ordered list of tasks for one student. Individual questions use seed|id|k; a variant group is placed where its first member sits in the pool,

// orderTasks (ny i 4.10): ordningen på elevens uppgifter.

// askLocal (5.18): poster som finns i webbläsaren men inte i mappen. Svar: 'copy', 'remove' (bara när mappen kopplas om) eller null (koppla inte mappen).
function askLocal(first,txt,name,kind){return ask(first?`Connect the ${kind} folder "${esc(name)}"?`:`Some data is not in the ${kind} folder "${esc(name)}"`,first?`<p>This browser has ${esc(txt)} that are not in the folder.</p>`:`<p>This browser has ${esc(txt)} that are not in the folder. They may have been deleted by someone else, or created while the folder was disconnected.</p>`,
 [{l:`Copy them into the ${kind} folder`,d:first?'Recommended. They are added to the folder, and the folder is connected.':'They are kept, and added to the folder again.',v:'copy',c:'pri'},
  ...(first?[]:[{l:'Remove them from this browser',d:'They are deleted here. Choose this if someone else deleted them on purpose.',v:'remove',c:'dng'}]),
  {l:first?"Don't connect this folder":'Disconnect this folder for now',d:'Nothing is copied or deleted.',v:null}])}
async function fsAttach(role,h,first){FS.h[role]=h;let R;
 try{R=await fsLoad(role)}catch(e){FS.h[role]=null;FS.msg='⚠ Could not read the folder: '+(e.message||e);fsBar();return false}
 let lo=0,txt='';
 if(role=='sh'){const q=pool.filter(x=>!x.src&&(!x.store||x.store=='sh')&&!R.pool.some(y=>y.id==x.id)),t=tests.filter(x=>!R.tests.some(y=>y.id==x.id));lo=q.length+t.length;txt=`${q.length} question${q.length==1?'':'s'} and ${t.length} test${t.length==1?'':'s'}`;
  if(lo){const a=await askLocal(first,txt,h.name,'questions');if(a=='copy'){R.pool.push(...q);R.tests.push(...t)}else if(a!='remove'){FS.h[role]=null;fsBar();return false}}}
 else if(role[0]=='q'){const q=pool.filter(x=>!x.src&&x.store==role&&!R.pool.some(y=>y.id==x.id));if(q.length){const a=await askLocal(first,q.length+' question'+(q.length==1?'':'s'),h.name,'questions');if(a=='copy')R.pool.push(...q);else if(a!='remove'){FS.h[role]=null;fsBar();return false}}}
 else if(role=='pr'){const c=classes.filter(x=>!R.classes.some(y=>y.id==x.id));lo=c.length;txt=`${c.length} class${c.length==1?'':'es'}`;
  if(lo){const a=await askLocal(first,txt,h.name,'student');if(a=='copy')R.classes.push(...c);else if(a!='remove'){FS.h[role]=null;fsBar();return false}}
  const mine=ld('mtb4_log',[]);R.log=dedupe(R.log.concat(mine),'t')}
 fsApply(role,R);FS.msg='Connected: '+h.name;await fsFlush();render();return true}
async function fsReload(silent){clearTimeout(FS.T);while(FS.run)await new Promise(r=>setTimeout(r,50));await fsFlush();let ch=0;
 for(const role of['sh','pr',...FS.xs]){if(!FS.h[role])continue;try{const R=await fsLoad(role);if(silent&&R.sig==FS.sig[role])continue;if(role=='pr'){R.log=dedupe(R.log.concat(ld('mtb4_log',[])),'t')}fsApply(role,R);ch=1}catch(e){FS.msg='⚠ '+(e.message||e)}}
 if(ch){FS.conf=[];FS.msg='Loaded from folders '+new Date().toTimeString().slice(0,5);render()}fsBar()}
function fsBar(){const b=$('#fsbar');if(!b)return;if(!window.showDirectoryPicker){b.innerHTML='<small>Saving to folders needs Chrome or Edge. Data is stored in this browser only; use Export for a file.</small>';return}
 const part=(r,l,t)=>FS.h[r]?`<span>📁 ${l}: <b>${esc(FS.h[r].name)}</b></span>`:FS.need[r]?`<button data-fs=perm data-r=${r}>Reconnect ${l.toLowerCase()} folder</button>`:`<button data-fs=pick data-r=${r} title="${t}">Choose ${l.toLowerCase()} folder</button>`,on=FS.h.sh||FS.h.pr;
 b.innerHTML=part('sh','Questions','Questions, tests and test backups. This is the folder to share with colleagues.')+part('pr','Student','Classes, student names, seeds and the print log. Keep this folder private.')+FS.xs.map(r=>FS.h[r]?`<span>📁 Questions: <b>${esc(FS.h[r].name)}</b> <button data-fs=rm data-r=${r} title="Stop using this folder">✕</button></span>`:FS.need[r]&&FS.pend[r]?`<button data-fs=perm data-r=${r}>Reconnect ${esc(FS.pend[r].name)}</button>`:'').join('')+`<button data-fs=addq title="Add another folder with questions, for example a private one next to a shared one. Only questions are read and saved there. Tests saved in the main questions folder contain copies of their questions, also those from this folder.">+ Add questions folder</button>`+(on?`<button data-fs=reload>Reload from folders</button><button data-fs=off>Disconnect</button>`:'')+`<small>${esc(FS.msg||(on?'':'Data is stored in this browser only.'))}</small><span class=warn2>⚠ The student folder holds names, classes and seeds. Be careful with how you share student data.</span>`+(FS.conf.length?`<span class=warn2>⚠ ${FS.conf.length} file${FS.conf.length>1?'s':''} changed by someone else: <button data-fs=mine>Overwrite with mine</button> <button data-fs=reload>Use theirs</button></span>`:'')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-fs]');if(!b)return;const r=b.dataset.r,a=b.dataset.fs;
 if(a=='pick'){try{const h=await showDirectoryPicker({id:'mtb-'+r,mode:'readwrite'});await idb('set',r,h);FS.need[r]=0;if(!await fsAttach(r,h,1))await idb('del',r)}catch(x){if(x.name!='AbortError')FS.msg='⚠ '+x.message}}
 else if(a=='perm'){const h=FS.pend[r];try{if(h&&await h.requestPermission({mode:'readwrite'})=='granted'){FS.need[r]=0;await fsAttach(r,h,0)}}catch(x){FS.msg='⚠ '+x.message}}
 else if(a=='reload')await fsReload(0);else if(a=='mine'){FS.force=1;FS.conf=[];await fsFlush()}
 else if(a=='addq'){try{const h=await showDirectoryPicker({id:'mtb-q',mode:'readwrite'});let dup=0;for(const k of['sh',...FS.xs])if(FS.h[k]&&await FS.h[k].isSameEntry(h))dup=1;
  if(dup)FS.msg='⚠ That folder is already connected.';else{const id='q'+Date.now().toString(36);FS.xs.push(id);await idb('set',id,h);await idb('set','xlist',FS.xs);if(!await fsAttach(id,h,1)){FS.xs=FS.xs.filter(x=>x!=id);await idb('set','xlist',FS.xs);await idb('del',id)}}}catch(x){if(x.name!='AbortError')FS.msg='⚠ '+x.message}}
 else if(a=='rm'){const n=pool.filter(q=>q.store==r).length,c=await ask(`Stop using the folder "${esc(FS.h[r]?FS.h[r].name:'')}"?`,`<p>${n} question${n==1?'':'s'} in this browser come${n==1?'s':''} from this folder. The files in the folder are not touched.</p>`,[
   {l:'Remove them from this browser',d:'Recommended. The questions stay in the folder and disappear from the question pool here.',v:'drop',c:'pri'},{l:'Keep them in this browser only',d:'They stay in the pool but are no longer saved to any folder.',v:'keep'},{l:'Cancel',d:'The folder stays connected.',v:null}]);
  if(c){FS.xs=FS.xs.filter(x=>x!=r);FS.h[r]=null;FS.need[r]=0;delete FS.idx[r];await idb('del',r);await idb('set','xlist',FS.xs);if(c=='drop')pool=pool.filter(q=>q.store!=r);else pool.forEach(q=>{if(q.store==r)q.store='-'});if(cur&&cur.store==r)cur.store='-';sv('mtb4_pool',pool)}}
 else if(a=='off'){for(const k of['sh','pr',...FS.xs]){FS.h[k]=null;FS.need[k]=0;await idb('del',k)}await idb('del','xlist');FS.xs=[];pool.forEach(q=>{if(q.store&&q.store!='sh')q.store='-'});sv('mtb4_pool',pool);FS.idx={sh:{},pr:{}};FS.conf=[];FS.msg='Disconnected. Data stays in this browser.'}
 fsBar();render()});
// Backupfrågor: bkMap() slår ihop provens egna frysta kopior och filerna i _backup. restoreQs lägger tillbaka frågor som saknas i frågebanken.
function bkMap(){const m={};const add=(d,qs)=>{const a=m[d]=m[d]||[];qs.forEach(q=>{if(!a.some(x=>x.id==q.id))a.push(q)})};tests.forEach(t=>add(safeN(t.name),t.questions));for(const d in FS.bk)add(d,FS.bk[d]);return m}
function vBk(){const m=bkMap(),k=Object.keys(m);return`<div class=box><h3>Test backups <small>(frozen copies of each test's questions${FS.h.sh?', also kept in the questions folder under questions/_backup':''}; they are never shown in the question pool)</small></h3>`+(k.length?k.map(d=>{const miss=m[d].filter(q=>!pool.some(x=>x.id==q.id)).length;return`<div class=row><b>${esc(d)}</b> <small>${m[d].length} question${m[d].length==1?'':'s'}, ${miss} missing from the pool</small> <button data-a=rstbk data-bk="${esc(d)}">Restore backup</button></div>`}).join(''):'<small>No backups yet. They are made when you save a test.</small>')+`</div>`}
function restoreBk(d){const qs=bkMap()[d]||[];if(!qs.length)return;const f=prompt(`Restore the questions from the backup "${d}".\nQuestions missing from the pool are added. Which folder should they go in? (empty = main folder)`,'Restored');if(f===null)return;restoreQs(qs,safeF(f),d)}
async function restoreQs(qs,folder,d){let add=0,ov=0,cp=0;const miss=[],diff=[];
 for(const q of qs){const c=pool.find(x=>x.id==q.id);if(!c)miss.push(q);else if(sg(c)!=sg(q))diff.push(q)}
 let mode='skip';
 if(diff.length){mode=await ask(`${diff.length} question${diff.length>1?'s':''} in the pool differ${diff.length>1?'':'s'} from the backup "${esc(d)}"`,`<p>These questions have been edited since the backup was made:</p>${nameList(diff)}`,[
  {l:'Keep the pool versions and add the backup versions as copies',d:'Recommended. Nothing in the pool is changed. The backup versions are added with "(backup)" in the name.',v:'copy',c:'pri'},
  {l:'Use the backup versions',d:'The pool gets the backup versions back. Your current versions are first saved as copies named "(replaced …)".',v:'ov'},
  {l:'Skip these questions',d:'Only the questions that are missing from the pool are added.',v:'skip'},
  {l:'Cancel',d:'Restore nothing. Nothing is changed.',v:null}]);
  if(mode===null)return}
 miss.forEach(q=>{pool.push({...JSON.parse(JSON.stringify(q)),folder});add++});
 if(mode=='ov')diff.forEach(q=>{const i=pool.findIndex(x=>x.id==q.id);keepCopy(pool[i]);pool[i]={...JSON.parse(JSON.stringify(q)),folder:pool[i].folder};ov++});
 else if(mode=='copy')diff.forEach(q=>{pool.push({...JSON.parse(JSON.stringify(q)),id:uid(),name:q.name+' (backup)',folder});cp++});
 save();FS.msg=`Restored from "${d}": ${add} added, ${ov} replaced, ${cp} added as copies`;fsBar();render()}
async function fsInit(){fsBar();if(!window.showDirectoryPicker)return;
 FS.xs=(await idb('get','xlist'))||[];for(const r of['sh','pr',...FS.xs]){const h=await idb('get',r);if(!h)continue;let p='prompt';try{p=await h.queryPermission({mode:'readwrite'})}catch(e){}if(p=='granted')await fsAttach(r,h,0);else{FS.need[r]=1;FS.pend[r]=h}}
 fsBar();document.addEventListener('visibilitychange',()=>{if(!document.hidden)fsReload(1)})}

render();fsInit();
</script></body></html>
