  if(sx<0||sy<0||sx>=sw-1||sy>=sh-1){out[o]=out[o+1]=out[o+2]=255;out[o+3]=255;continue}const x0=sx|0,y0=sy|0,fx=sx-x0,fy=sy-y0,i=(y0*sw+x0)*4,j=i+sw*4;

const FSN=5;

 return(4294967296*(2097151&h2)+(h1>>>0)).toString(36).padStart(11,'0').slice(-FSN)}

 h+=`<div class=row><input type=text id=exurl placeholder="Address (URL) of a question file, e.g. https://example.com/algebra.mtbq" style="width:430px" value="${esc(EXURLV)}"> <input type=text id=exname placeholder="Name (used as the tag)" style="width:200px" value="${esc(EXNAMEV)}"> <label title="On (recommended): the questions you add are saved in this browser, so they stay even if the page disappears or changes. Off: they are only kept while this page is open."><input type=checkbox id=exkeep checked> Save local copies</label> <button class=go data-a=exadd>Add bank</button></div><div class=row><small>If the bank needs access:</small> <input type=text id=exuser placeholder="Username (login)" autocomplete=off style="width:150px" value="${esc(EXUSERV)}"> <input type=password id=expass placeholder="Password or token (login)" autocomplete=new-password style="width:190px" value="${esc(EXPASSV)}"> <input type=password id=exfpw placeholder="Password for an encrypted bank" autocomplete=new-password style="width:220px" value="${esc(EXFPWV)}"></div><div><small>You only type it once. It is saved on this device together with the bank, in plain text, so only use a browser profile that only you can open.</small></div>${EXMSG?`<div><small data-msg>${esc(EXMSG)}</small></div>`:''}`;
 h+=EXB.map(b=>`<div class=exb><div class=row><b>${esc(b.name)}</b>${b.desc?` <span class=tdesc>— ${esc(b.desc)}</span>`:''} <small>${esc(b.url)}</small> <small>${b.enc?'🔑 ':''}${b.cred?'👤 ':''}${b.n||0} question${b.n==1?'':'s'}${b.nt?' · '+b.nt+' test'+(b.nt==1?'':'s'):''}${b.at?' · fetched '+esc(String(b.at).slice(0,10)):''}</small> <label title="Applies to questions you add from now on"><input type=checkbox data-exkeep="${esc(b.id)}" ${b.keep?'checked':''}> Save local copies</label> <button data-a=exacc data-k="${esc(b.id)}">Access…</button> <button data-a=exopen data-k="${esc(b.id)}">${EXOPEN==b.id?'Close':'Browse'}</button> <button data-a=exrm data-k="${esc(b.id)}">Remove bank</button></div>${EXOPEN==b.id?exBrowse(b):''}</div>`).join('');return h+'</div>'}
async function exAccess(id){const b=EXB.find(x=>x.id==id);if(!b)return;
 const v=await ask('Access to "'+esc(b.name)+'"',`<p><small>Saved on this device: ${b.cred?'a login'+(b.user?' (username <b>'+esc(b.user)+'</b>)':' (a token)'):'no login'}, ${b.pw?'a password for the encrypted file':'no file password'}.</small></p>`,[{l:'Change what is saved',d:'You type the new values. Empty fields keep what is saved.',v:'chg',c:'pri'},{l:'Remove everything that is saved',d:'The bank stays in the list.',v:'rm'},{l:'Cancel',d:'',v:null}]);if(!v)return;
 if(v=='rm'){delete b.cred;delete b.user;delete b.auth;delete b.pw}
 else{const r=await askSecret('Access to "'+esc(b.name)+'"','<p><small>Leave a field empty to keep what is saved.</small></p>',[{k:'user',label:'Username (login)',type:'text',v:b.user||''},{k:'cred',label:'Password or token (login)',type:'password'},{k:'pw',label:'Password for an encrypted bank',type:'password'}]);if(!r)return;
  if(r.cred){b.cred=r.cred;b.user=String(r.user||'').trim();b.auth=b.user?'basic':'bearer'}else if(b.cred&&r.user!==undefined&&String(r.user).trim()!==(b.user||'')){b.user=String(r.user).trim();b.auth=b.user?'basic':'bearer'}if(r.pw)b.pw=r.pw}
 exSave();delete EXQ[id];if(EXOPEN==id)exLoad(id);else render()}
async function exAddTests(id){const b=EXB.find(x=>x.id==id),E=EXQ[id];if(!b||!E||!E.ts)return;const sel=E.ts.filter(t=>EXSELT.has(String(t.id)));if(!sel.length){EXMSG='Tick some tests first.';render();return}
 const keep=keepOf(b,E),tg=allTags().find(t=>t.toLowerCase()==b.name.toLowerCase())||b.name,L=JSON.parse(JSON.stringify(sel));L.forEach(t=>t.questions.forEach(q=>{q.tags=Array.isArray(q.tags)?q.tags.map(String):[];if(!q.tags.some(x=>x.toLowerCase()==tg.toLowerCase()))q.tags.push(tg)}));
 await impTests([new File([JSON.stringify({app:'mtb-tests',v:1,tests:L})],'bank.mtbt',{type:'application/json'})],{b:id,bn:b.name,u:b.url,at:E.at,keep});EXSELT.clear();render()}
async function exLoad(id){const b=EXB.find(x=>x.id==id);if(!b)return;EXBUSY.add(id);render();try{const E=await exGet(b);EXQ[id]=E;b.n=E.qs.length;b.nt=E.ts.length;b.at=E.at;if(E.desc)b.desc=E.desc;exSave()}catch(e){EXQ[id]={err:exErr(e)}}EXBUSY.delete(id);render()}
function exOpen(id){if(EXOPEN==id){EXOPEN='';render();return}EXOPEN=id;EXSRCH='';EXSEL.clear();EXPREV.clear();if(!EXQ[id]||EXQ[id].err)exLoad(id);else render()}
async function exAddBank(){const url=($('#exurl')||{}).value||'',nm=(($('#exname')||{}).value||'').trim(),keep=$('#exkeep')?$('#exkeep').checked:true;EXURLV=url;EXNAMEV=nm;EXUSERV=($('#exuser')||{}).value||'';EXPASSV=($('#expass')||{}).value||'';EXFPWV=($('#exfpw')||{}).value||'';let u;try{u=exUrl(url)}catch(e){EXMSG=e.message;render();return}
 if(EXB.some(b=>b.url==u)){EXMSG='That address has already been added.';render();return}EXMSG='Fetching …';render();
 const b0={id:nid(),name:nm,url:u,keep:keep?1:0};if(EXPASSV){b0.cred=EXPASSV;b0.user=EXUSERV.trim();b0.auth=b0.user?'basic':'bearer'}if(EXFPWV)b0.pw=EXFPWV;try{const E=await exGet(b0),name=(nm||E.name||decodeURIComponent((u.split('?')[0].split('/').pop()||'').replace(/\.(mtbq|json)$/i,'')).replace(/[-_]+/g,' ')||'Question bank').replace(/[,;]+/g,' ').replace(/\s+/g,' ').trim();
  if(EXB.some(b=>b.name.toLowerCase()==name.toLowerCase())){EXMSG='There is already a bank called "'+name+'". Type another name.';render();return}
  const b=Object.assign(b0,{name,n:E.qs.length,nt:E.ts.length,at:E.at});if(E.desc)b.desc=E.desc;EXB.push(b);exSave();EXQ[b.id]=E;EXOPEN=b.id;EXSRCH='';EXSEL.clear();EXPREV.clear();EXURLV='';EXNAMEV='';EXUSERV='';EXPASSV='';EXFPWV='';EXMSG=`Added "${name}"${b.enc?' (protected)':''} with ${E.qs.length} question${E.qs.length==1?'':'s'}${E.ts.length?' and '+E.ts.length+' test'+(E.ts.length==1?'':'s'):''}. Tick what you want and press Add.`}
 catch(e){EXMSG=exErr(e)}render()}
function exSelShown(id){const E=EXQ[id];if(!E||!E.qs)return;const q=EXSRCH.toLowerCase().trim(),L=E.qs.filter(x=>!q||[x.name,x.lvl,x.cat,x.sub,x.sub2,...(x.tags||[])].join(' ').toLowerCase().includes(q)),all=L.every(x=>EXSEL.has(String(x.id)));L.forEach(x=>all?EXSEL.delete(String(x.id)):EXSEL.add(String(x.id)))}
function exAddSel(id){const b=EXB.find(x=>x.id==id),E=EXQ[id];if(!b||!E||!E.qs)return;let n=0,sk=0;E.qs.filter(x=>EXSEL.has(String(x.id))).forEach(x=>{if(exLocal(b,x)){sk++;return}pool.push(exMake(b,x,E));n++;EXSEL.delete(String(x.id))});save();
 EXMSG=n?`Added ${n} question${n==1?'':'s'} to your questions with the tag "${b.name}".`+(keepOf(b,E)?' They are saved like your other questions.':' They are only kept while this page is open.')+(sk?` ${sk} you already had.`:''):(sk?'You already have those questions.':'Tick some questions first.')}
function exUpdate(id,qid){const b=EXB.find(x=>x.id==id),E=EXQ[id];if(!b||!E||!E.qs)return;const x=E.qs.find(z=>String(z.id)==qid),j=pool.findIndex(z=>z.ext&&z.ext.b==id&&z.ext.k==qid);if(!x||j<0)return;const old=pool[j],c=exMake(b,x,E);c.tags=Array.from(new Set([...(old.tags||[]),...(c.tags||[])]));c.ext.keep=old.ext.keep;if(!c.ext.keep)c.store='-';else if(old.store)c.store=old.store;if(old.bench)c.bench=old.bench;pool[j]=c;save();EXMSG='Updated "'+(c.name||'question')+'".'}
async function exRemove(id){const b=EXB.find(x=>x.id==id);if(!b)return;const n=pool.filter(q=>q.ext&&q.ext.b==id).length;const v=await ask('Remove the bank "'+esc(b.name)+'"?',n?`<p>You have ${n} question${n==1?'':'s'} from this bank in your question pool.</p>`:'<p>No questions from this bank are in your question pool.</p>',n?[{l:'Remove the bank, keep my questions',d:'The questions stay in your pool and cannot be edited, but you can make editable copies.',v:'keep',c:'pri'},{l:'Remove the bank and its questions',d:'The questions are deleted from your pool. Saved tests keep their own copies.',v:'del'},{l:'Cancel',d:'',v:null}]:[{l:'Remove the bank',d:'',v:'keep',c:'pri'},{l:'Cancel',d:'',v:null}]);
 if(!v)return;if(v=='del')pool=pool.filter(q=>!(q.ext&&q.ext.b==id));EXB=EXB.filter(x=>x.id!=id);delete EXQ[id];if(EXOPEN==id)EXOPEN='';exSave();save();render()}
async function exView(i){const q=pool[i];if(!q||!q.ext)return;const e=q.ext,v=await ask('🔒 '+esc(q.name||'Question'),`<p><small>From the external question bank <b>${esc(e.bn)}</b> (${esc(e.u)}), saved ${esc(String(e.at).slice(0,10))}${e.keep?'':'. It is only kept while this page is open'}. The question cannot be edited, but you can make an editable copy.</small></p>${exPrev(q)}`,[{l:'Close',d:'',v:null},{l:'Make an editable copy',d:'A normal question that you can change.',v:1}]);
 if(v){const c=JSON.parse(JSON.stringify(q));c.id=uid();c.name+=' (copy)';['src','orig','bench','ext'].forEach(k=>delete c[k]);pool.splice(i+1,0,c);uReset();cur=JSON.parse(JSON.stringify(c));az='w.0.0';save();render()}}
document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.ext!==undefined){t.checked?EXSELT.add(t.dataset.ext):EXSELT.delete(t.dataset.ext)}if(t&&t.dataset&&(t.dataset.exq!==undefined||t.dataset.ext!==undefined||t.dataset.exkeep!==undefined)){const y=scrollY,L=document.querySelector('.exl'),ls=L?L.scrollTop:0;setTimeout(()=>{const n=document.querySelector('.exl');if(n)n.scrollTop=ls;scrollTo(0,y)},0)}},true);
document.addEventListener('change',e=>{const t=e.target;if(!t||!t.dataset)return;if(t.dataset.exq!==undefined){t.checked?EXSEL.add(t.dataset.exq):EXSEL.delete(t.dataset.exq);const bt=document.querySelector('button[data-a=exaddq]');if(bt){const E=EXQ[EXOPEN],n=E&&E.qs?E.qs.filter(x=>EXSEL.has(String(x.id))).length:0;bt.disabled=!n;bt.textContent='Add '+(n||'')+' selected to my questions'}}
 else if(t.dataset.exkeep!==undefined){const b=EXB.find(x=>x.id==t.dataset.exkeep);if(b){b.keep=t.checked?1:0;exSave()}}});
document.addEventListener('input',e=>{const t=e.target;if(!t||!t.dataset||t.dataset.exsearch===undefined)return;EXSRCH=t.value;const pos=t.selectionStart;clearTimeout(window._exT);window._exT=setTimeout(()=>{render();const n=document.querySelector('[data-exsearch]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}},200)});
render();fsInit();
</script></body></html>
